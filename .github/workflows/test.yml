name: Test

# Manual only: a full FFmpeg build takes several minutes per target.
"on":
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-macos:
    name: Test macOS (JVM + Apple native)
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache the FFmpeg build tree
        uses: actions/cache@v4
        with:
          path: build/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('.gitmodules') }}-${{ github.sha }}
          restore-keys: |
            ffmpeg-${{ runner.os }}-${{ hashFiles('.gitmodules') }}-

      - name: Setup Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install latest
          "$HOME/emsdk/emsdk" activate latest
          echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"

      - name: Run JVM, macOS native and web tests
        run: |
          MODULES="libavutil-kmp libavcodec-kmp libavformat-kmp libavfilter-kmp libswscale-kmp libswresample-kmp libavdevice-kmp"
          TASKS=":ffmpeg-kmp:jvmTest :ffmpeg-kmp:macosArm64Test :ffmpeg-kmp:linkDebugTestMacosX64"
          TASKS="$TASKS :ffmpeg-kmp:jsNodeTest :ffmpeg-kmp:wasmJsNodeTest"
          TASKS="$TASKS :ffmpeg-kmp:bridge:jsNodeTest :ffmpeg-kmp:bridge:wasmJsNodeTest"
          TASKS="$TASKS :examples:ffmpeg-core:jvmTest :examples:ffmpeg-core:macosArm64Test"
          for module in $MODULES; do
            TASKS="$TASKS :$module:jvmTest :$module:macosArm64Test :$module:linkDebugTestMacosX64"
            TASKS="$TASKS :$module:jsNodeTest :$module:wasmJsNodeTest"
          done
          ./gradlew --no-daemon --stacktrace $TASKS

      - name: Run the headless JVM example
        run: >
          ./gradlew --no-daemon --stacktrace
          :examples:camera-ffmpeg:jvmRun
          --args="--headless --frames=30 --source=synthetic --filter=negate --scale=50 --record --container=matroska --record-path=build/ci.mp4"

      - name: Run the headless native example
        env:
          CAMERA_FFMPEG_HEADLESS: "1"
          CAMERA_FFMPEG_FRAMES: "30"
          CAMERA_FFMPEG_SOURCE: synthetic
          CAMERA_FFMPEG_FILTER: negate
          CAMERA_FFMPEG_SCALE: "50"
          CAMERA_FFMPEG_RECORD: "1"
          CAMERA_FFMPEG_CONTAINER: matroska
          CAMERA_FFMPEG_RECORD_PATH: build/ci-native.mp4
        run: >
          ./gradlew --no-daemon --stacktrace
          :examples:camera-ffmpeg:runDebugExecutableMacosArm64

      - name: Stage and smoke-test the @enaium/ffmpeg-kmp npm package
        run: |
          ./gradlew --no-daemon --stacktrace :ffmpeg-kmp:assembleWasmNpm
          node --check ffmpeg-kmp/build/npm/ffmpeg_kmp_glue.js
          node -e "import('file://' + process.cwd() + '/ffmpeg-kmp/build/npm/ffmpeg_kmp_glue.js').then(async (m) => { const api = await m.initFFmpegKmp(); const p = api.callInt('fk_version_info',0,0,0,0,0,0,0); const version = api.readString(p); if (!version) throw new Error('@enaium/ffmpeg-kmp failed to initialize'); console.log('npm package version=' + version); })"

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"

      - name: Publish supported artifacts to Maven Local
        run: |
          MODULES="ffmpeg-kmp:bridge libavutil-kmp libavcodec-kmp libavformat-kmp libavfilter-kmp libswscale-kmp libswresample-kmp libavdevice-kmp ffmpeg-kmp"
          TASKS=""
          for module in $MODULES; do
            TASKS="$TASKS :$module:publishKotlinMultiplatformPublicationToMavenLocal"
            TASKS="$TASKS :$module:publishJvmPublicationToMavenLocal"
            TASKS="$TASKS :$module:publishMacosArm64PublicationToMavenLocal"
            TASKS="$TASKS :$module:publishMacosX64PublicationToMavenLocal"
            TASKS="$TASKS :$module:publishJsPublicationToMavenLocal"
            TASKS="$TASKS :$module:publishWasmJsPublicationToMavenLocal"
          done
          ./gradlew --no-daemon --stacktrace $TASKS \
            -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}" \
            -Psigning.secretKeyRingFile="$RUNNER_TEMP/signing-key.gpg" \
            -Psigning.password="${{ secrets.SIGNING_PASSWORD }}" \
            :jni-jvm-darwin-aarch64:publishToMavenLocal \
            :jni-jvm-darwin-x86_64:publishToMavenLocal

      - name: Verify Maven Local artifacts
        run: |
          REPO="$HOME/.m2/repository/cn/enaium/ffmpeg"
          test -f "$REPO/ffmpeg-kmp-jvm/9.0.2.1/ffmpeg-kmp-jvm-9.0.2.1.pom" \
            || { echo "FAIL: aggregate JVM POM missing"; exit 1; }
          grep -q "ffmpeg-kmp-bridge-jvm" \
            "$REPO/ffmpeg-kmp-jvm/9.0.2.1/ffmpeg-kmp-jvm-9.0.2.1.pom" \
            || { echo "FAIL: aggregate POM lacks the bridge"; exit 1; }
          grep -q "libavcodec-kmp-jvm" \
            "$REPO/ffmpeg-kmp-jvm/9.0.2.1/ffmpeg-kmp-jvm-9.0.2.1.pom" \
            || { echo "FAIL: aggregate POM lacks libavcodec-kmp"; exit 1; }
          unzip -l "$REPO/ffmpeg-kmp-bridge-jvm/9.0.2.1/ffmpeg-kmp-bridge-jvm-9.0.2.1.jar" \
            | grep -q "cn/enaium/ffmpeg/native/FFmpegNative.class" \
            || { echo "FAIL: bridge JVM jar lacks FFmpegNative"; exit 1; }
          grep -q "ffmpeg-kmp-bridge-jvm" \
            "$REPO/libavcodec-kmp-jvm/9.0.2.1/libavcodec-kmp-jvm-9.0.2.1.pom" \
            || { echo "FAIL: libavcodec-kmp POM lacks the bridge"; exit 1; }
          grep -q "libavutil-kmp-jvm" \
            "$REPO/libavcodec-kmp-jvm/9.0.2.1/libavcodec-kmp-jvm-9.0.2.1.pom" \
            || { echo "FAIL: libavcodec-kmp POM lacks libavutil-kmp"; exit 1; }
          JNI_JAR="$REPO/ffmpeg-kmp-jni-jvm-darwin-aarch64/9.0.2.1/ffmpeg-kmp-jni-jvm-darwin-aarch64-9.0.2.1.jar"
          test -f "$JNI_JAR" || { echo "FAIL: darwin JNI jar missing"; exit 1; }
          unzip -l "$JNI_JAR" | grep -q "libffmpeg_jni.dylib" \
            || { echo "FAIL: dylib missing from JNI jar"; exit 1; }
          test -f "$JNI_JAR.asc" || { echo "FAIL: JNI jar is not signed"; exit 1; }
          test -f "$REPO/ffmpeg-kmp-jvm/9.0.2.1/ffmpeg-kmp-jvm-9.0.2.1.pom.asc" \
            || { echo "FAIL: aggregate POM is not signed"; exit 1; }
          test -n "$(find "$REPO" -name '*.klib' -print -quit)" \
            || { echo "FAIL: no Apple klib published"; exit 1; }
          test -n "$(find "$REPO" -name '*.klib.asc' -print -quit)" \
            || { echo "FAIL: Apple klib is not signed"; exit 1; }
          for artifact in ffmpeg-kmp-js ffmpeg-kmp-wasm-js ffmpeg-kmp-bridge-js ffmpeg-kmp-bridge-wasm-js; do
            test -d "$REPO/$artifact/9.0.2.1" \
              || { echo "FAIL: missing $artifact"; exit 1; }
          done
          echo "OK: macOS publication"

  test-linux:
    name: Test Linux (JVM + Linux/Android native)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install cross compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-mingw-w64-x86-64

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "platforms;android-37.1" "ndk;27.0.12077973" >/dev/null

      - name: Cache the FFmpeg build tree
        uses: actions/cache@v4
        with:
          path: build/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('.gitmodules') }}-${{ github.sha }}
          restore-keys: |
            ffmpeg-${{ runner.os }}-${{ hashFiles('.gitmodules') }}-

      - name: Run JVM, Linux, Android host and cross-target tests
        run: |
          MODULES="libavutil-kmp libavcodec-kmp libavformat-kmp libavfilter-kmp libswscale-kmp libswresample-kmp libavdevice-kmp"
          TASKS=":ffmpeg-kmp:jvmTest :ffmpeg-kmp:linuxX64Test :ffmpeg-kmp:testAndroidHostTest"
          TASKS="$TASKS :ffmpeg-kmp:linkDebugTestLinuxArm64 :ffmpeg-kmp:linkDebugTestMingwX64"
          TASKS="$TASKS :ffmpeg-kmp:linkDebugTestAndroidNativeArm64 :ffmpeg-kmp:linkDebugTestAndroidNativeArm32"
          TASKS="$TASKS :ffmpeg-kmp:linkDebugTestAndroidNativeX64 :ffmpeg-kmp:linkDebugTestAndroidNativeX86"
          TASKS="$TASKS :examples:ffmpeg-core:linuxX64Test"
          for module in $MODULES; do
            TASKS="$TASKS :$module:jvmTest :$module:linuxX64Test :$module:testAndroidHostTest"
            TASKS="$TASKS :$module:linkDebugTestAndroidNativeArm64"
          done
          ./gradlew --no-daemon --stacktrace --continue $TASKS

      - name: Assemble the Android example
        run: ./gradlew --no-daemon --stacktrace :examples:camera-ffmpeg:android:assembleDebug

      - name: Verify the Android APK native libraries
        run: |
          APK="examples/camera-ffmpeg/android/build/outputs/apk/debug/android-debug.apk"
          test -f "$APK" || { echo "FAIL: APK missing"; exit 1; }
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            unzip -l "$APK" | grep -q "lib/$abi/libmain.so" \
              || { echo "FAIL: APK lacks $abi libmain.so"; exit 1; }
            unzip -l "$APK" | grep -q "lib/$abi/libc++_shared.so" \
              || { echo "FAIL: APK lacks $abi libc++_shared.so"; exit 1; }
          done
          echo "OK: APK contains all four ABIs"

      - name: Verify the static archives
        run: |
          for target in linuxX64 linuxArm64 mingwX64 androidNativeArm64 androidNativeArm32 androidNativeX64 androidNativeX86; do
            archive="ffmpeg-kmp/bridge/build/native/$target/libffmpeg_kmp.a"
            test -f "$archive" || { echo "FAIL: missing $archive"; exit 1; }
            echo "OK: $archive ($(du -h "$archive" | cut -f1))"
          done

      - name: Run the headless Linux native example
        env:
          CAMERA_FFMPEG_HEADLESS: "1"
          CAMERA_FFMPEG_FRAMES: "30"
          CAMERA_FFMPEG_SOURCE: synthetic
          CAMERA_FFMPEG_FILTER: negate
          CAMERA_FFMPEG_SCALE: "50"
          CAMERA_FFMPEG_RECORD: "1"
          CAMERA_FFMPEG_CONTAINER: matroska
          CAMERA_FFMPEG_RECORD_PATH: build/ci-linux.mp4
        run: ./gradlew --no-daemon --stacktrace :examples:camera-ffmpeg:runDebugExecutableLinuxX64

  test-windows:
    name: Test Windows (JVM + MinGW)
    runs-on: windows-latest
    env:
      MSYS2_ROOT: C:\msys64
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install MSYS2 MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            make

      - name: Add MSYS2 to PATH
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\msys64\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run JVM and MinGW native tests
        shell: bash
        run: |
          MODULES="libavutil-kmp libavcodec-kmp libavformat-kmp libavfilter-kmp libswscale-kmp libswresample-kmp libavdevice-kmp"
          TASKS=":ffmpeg-kmp:jvmTest :ffmpeg-kmp:mingwX64Test :examples:ffmpeg-core:mingwX64Test"
          for module in $MODULES; do
            TASKS="$TASKS :$module:jvmTest :$module:mingwX64Test"
          done
          ./gradlew --no-daemon --stacktrace $TASKS

      - name: Run the headless Windows native example
        env:
          CAMERA_FFMPEG_HEADLESS: "1"
          CAMERA_FFMPEG_FRAMES: "30"
          CAMERA_FFMPEG_SOURCE: synthetic
          CAMERA_FFMPEG_FILTER: negate
          CAMERA_FFMPEG_SCALE: "50"
          CAMERA_FFMPEG_RECORD: "1"
          CAMERA_FFMPEG_CONTAINER: matroska
          CAMERA_FFMPEG_RECORD_PATH: build/ci-windows.mp4
        run: ./gradlew --no-daemon --stacktrace :examples:camera-ffmpeg:runDebugExecutableMingwX64

      - name: Verify the Windows JNI library
        shell: pwsh
        run: |
          $dll = "jni/jvm/windows-x86_64/build/jni-native/windows-x86_64/ffmpeg_jni.dll"
          if (!(Test-Path $dll)) { throw "Missing $dll" }
          Write-Output "OK: $((Get-Item $dll).Length) bytes"
