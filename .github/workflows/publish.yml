name: Publish

"on":
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

# Maven Central coordinates are immutable, so every publication is produced by
# exactly one runner:
#
#   macos-15       -> KotlinMultiplatform metadata, JVM, macOS x64/arm64
#                     shared bridge, darwin JNI artifacts
#   ubuntu-latest  -> Android AAR, Linux x64/arm64, MinGW, Android Native
#                     shared bridge, linux + windows JNI artifacts (MinGW cross build)
#
# Required repository secrets:
#   MAVEN_CENTRAL_USERNAME   Sonatype Central Portal user-token username
#   MAVEN_CENTRAL_PASSWORD   Sonatype Central Portal user-token password
#   SIGNING_KEY              base64-encoded PGP secret key ring (.gpg, binary)
#   SIGNING_KEY_ID           8-hex-digit key id (without the 0x prefix)
#   SIGNING_PASSWORD         passphrase of the signing key
#   NPM_PUBLISH_KEY          npm automation token for @enaium/ffmpeg-kmp

jobs:
  publish-macos:
    name: Publish JVM, Apple native and darwin JNI
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install latest
          "$HOME/emsdk/emsdk" activate latest
          echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"

      - name: Publish JVM, metadata and Apple native artifacts
        run: |
          MODULES="ffmpeg-kmp:bridge libavutil-kmp libavcodec-kmp libavformat-kmp libavfilter-kmp libswscale-kmp libswresample-kmp libavdevice-kmp ffmpeg-kmp"
          TASKS=""
          for module in $MODULES; do
            TASKS="$TASKS :$module:publishKotlinMultiplatformPublicationToMavenCentralRepository"
            TASKS="$TASKS :$module:publishJvmPublicationToMavenCentralRepository"
            TASKS="$TASKS :$module:publishMacosArm64PublicationToMavenCentralRepository"
            TASKS="$TASKS :$module:publishMacosX64PublicationToMavenCentralRepository"
            TASKS="$TASKS :$module:publishJsPublicationToMavenCentralRepository"
            TASKS="$TASKS :$module:publishWasmJsPublicationToMavenCentralRepository"
          done
          ./gradlew --no-daemon --stacktrace $TASKS \
            -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}" \
            -Psigning.secretKeyRingFile="$RUNNER_TEMP/signing-key.gpg" \
            -Psigning.password="${{ secrets.SIGNING_PASSWORD }}" \
            :jni-jvm-darwin-aarch64:publishToMavenCentral \
            :jni-jvm-darwin-x86_64:publishToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

      - name: Publish the @enaium/ffmpeg-kmp npm package
        run: |
          install -d "$HOME/.gradle"
          printf 'npm.publish.key=%s\n' "$NPM_PUBLISH_KEY" >> "$HOME/.gradle/gradle.properties"
          ./gradlew --no-daemon --stacktrace :ffmpeg-kmp:publishWasmNpm
        env:
          NPM_PUBLISH_KEY: ${{ secrets.NPM_PUBLISH_KEY }}

  publish-linux:
    name: Publish Android, Linux, MinGW and linux/windows JNI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install cross compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-mingw-w64-x86-64

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "platforms;android-37.1" "ndk;27.0.12077973" >/dev/null

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"

      - name: Publish Android, Linux, MinGW and Android Native artifacts
        run: |
          MODULES="ffmpeg-kmp:bridge libavutil-kmp libavcodec-kmp libavformat-kmp libavfilter-kmp libswscale-kmp libswresample-kmp libavdevice-kmp ffmpeg-kmp"
          TASKS=""
          for module in $MODULES; do
            TASKS="$TASKS :$module:publishAndroidPublicationToMavenCentralRepository"
            TASKS="$TASKS :$module:publishLinuxX64PublicationToMavenCentralRepository"
            TASKS="$TASKS :$module:publishLinuxArm64PublicationToMavenCentralRepository"
            TASKS="$TASKS :$module:publishMingwX64PublicationToMavenCentralRepository"
            TASKS="$TASKS :$module:publishAndroidNativeArm64PublicationToMavenCentralRepository"
            TASKS="$TASKS :$module:publishAndroidNativeArm32PublicationToMavenCentralRepository"
            TASKS="$TASKS :$module:publishAndroidNativeX64PublicationToMavenCentralRepository"
            TASKS="$TASKS :$module:publishAndroidNativeX86PublicationToMavenCentralRepository"
          done
          ./gradlew --no-daemon --stacktrace $TASKS \
            -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}" \
            -Psigning.secretKeyRingFile="$RUNNER_TEMP/signing-key.gpg" \
            -Psigning.password="${{ secrets.SIGNING_PASSWORD }}" \
            :jni-jvm-linux-x86_64:publishToMavenCentral \
            :jni-jvm-linux-aarch64:publishToMavenCentral \
            :jni-jvm-windows-x86_64:publishToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
